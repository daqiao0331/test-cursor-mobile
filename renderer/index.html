<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>Serene · 静观</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <!-- 播放层：双视频（交叉淡化） + 着色器画布 + 元胞画布 -->
  <video id="v0" class="layer" playsinline preload="auto"></video>
  <video id="v1" class="layer" playsinline preload="auto"></video>
  <canvas id="glCanvas" class="layer"></canvas>
  <canvas id="caCanvas" class="layer"></canvas>

  <!-- 呼吸引导 HUD（按 B 开启，Canvas 绘制） -->
  <canvas id="breathCanvas" class="hidden"></canvas>

  <!-- 提示气泡 -->
  <div id="toast"></div>

  <!-- 菜单按钮（鼠标移动时出现） -->
  <button id="menuBtn" title="菜单 (M)">≡</button>

  <!-- 菜单 -->
  <aside id="menu" class="hidden">
    <header>
      <div>
        <h2>SERENE</h2>
        <span class="sub">静观 · 视觉源</span>
      </div>
      <button id="closeMenu" title="关闭 (Esc)">✕</button>
    </header>

    <section>
      <div class="secTitle">算法动画</div>
      <ul id="sceneList" class="list"></ul>
    </section>

    <section>
      <div class="secTitle">
        视频
        <button id="refreshBtn" class="mini" title="重新扫描 videos/ 文件夹">刷新</button>
      </div>
      <ul id="videoList" class="list"></ul>
      <p id="folderHint" class="hint"></p>
      <div class="row">
        <button id="addFilesBtn" class="wide">＋ 本地视频文件</button>
      </div>
      <div class="row">
        <input id="urlInput" type="text" placeholder="粘贴视频直链 https://…" />
        <button id="addUrlBtn">添加</button>
      </div>
      <input id="fileFallback" type="file" accept="video/*" multiple hidden />
      <p class="hint">
        免费 4K 素材：
        <a href="https://www.pexels.com/videos/" data-ext>Pexels</a> ·
        <a href="https://pixabay.com/videos/" data-ext>Pixabay</a> ·
        <a href="https://mixkit.co/free-stock-video/nature/" data-ext>Mixkit</a> ·
        <a href="https://coverr.co/" data-ext>Coverr</a>
      </p>
    </section>

    <section>
      <div class="secTitle">快捷键</div>
      <ul class="keys">
        <li><kbd>M</kbd> 菜单</li>
        <li><kbd>空格</kbd> 暂停</li>
        <li><kbd>→</kbd><kbd>←</kbd> 切换</li>
        <li><kbd>L</kbd> 停留循环</li>
        <li><kbd>B</kbd> 呼吸引导</li>
        <li><kbd>S</kbd> 声音</li>
        <li><kbd>F</kbd> 全屏</li>
        <li><kbd>Q</kbd> 退出</li>
      </ul>
    </section>
  </aside>

  <script src="scenes.js"></script>
  <script src="app.js"></script>
</body>
</html>
